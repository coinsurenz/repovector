# Self-hosted pgvector plus the repo-vector query API.
#
#   cp .env.example .env    # fill in POSTGRES_PASSWORD, REPO_VECTOR_SERVER_TOKEN, REPO_VECTOR_REPO, provider key
#   docker compose up -d
#
# The GitHub Action writes into this database from CI. Postgres listens on 127.0.0.1 only, which suits a
# self-hosted runner on this host (see "Reaching the database from CI" in the README). Set POSTGRES_BIND
# only if something else must reach it, and then put TLS and a firewall in front: this image has no TLS.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: repo_vector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vectors
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repo-vector-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_vector -d vectors"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      REPO_VECTOR_STORE: postgres
      DATABASE_URL: postgres://repo_vector:${POSTGRES_PASSWORD}@db:5432/vectors
      REPO_VECTOR_REPO: ${REPO_VECTOR_REPO:?set REPO_VECTOR_REPO (owner/name) in .env}
      REPO_VECTOR_BRANCH: ${REPO_VECTOR_BRANCH:-main}
      REPO_VECTOR_INDEX: ${REPO_VECTOR_INDEX:-}
      REPO_VECTOR_SERVER_TOKEN: ${REPO_VECTOR_SERVER_TOKEN:?set REPO_VECTOR_SERVER_TOKEN in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${REPO_VECTOR_SERVER_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  repo-vector-pgdata: {}
